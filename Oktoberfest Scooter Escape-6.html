  const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(state==='play'&&e.key===' ')jump();
  if(state==='menu'&&!showSet&&!shopOpen){if(e.key===' '||e.key==='Enter')launch();
    if(e.key>='1'&&e.key<='5'){lvl=+e.key;savePrefs();}
    if(e.key==='ArrowLeft'||k==='a')nextCh(-1);if(e.key==='ArrowRight'||k==='d')nextCh(1);}

  if(k==='m')muted=!muted;

  if(state==='pause'){if(k==='p'||e.key==='Escape'||e.key===' '||e.key==='Enter')resumeGame();else if(k==='q')quitGame();return;}

  if(state==='pause'){const q=pT(),px=(p.x-q.cx)/q.s+PW/2,py=(p.y-q.cy)/q.s+PH/2;if(px>=18&&px<=PW-18){if(py>=134&&py<=204){resumeGame();return;}if(py>=208&&py<=266){quitGame();return;}}return;}
