const ZL=20000;let off0=0,curZone=1,zb=9,zbz=0,runPz=0,pzStreak=0,pzLast=0,pzBump=0,lastEarn=0,trl=[],trlT=0,tPz=2;

function nightAt(w){if(!inRun())return 0;const r=zr(w);if(r<0)return 0;const n=Math.floor(r/ZL),z=n%4,f=r-n*ZL;if(z===3)return clamp(f/2500,0,1);if(z===0&&n>0)return 1-clamp(f/2500,0,1);return 0;}

  const s2=sc();newRec=s2>stats.high;if(newRec)stats.high=s2;lastEarn=runPz+Math.floor(s2/250);stats.pz+=lastEarn;saveStats();}
function spawnCop(){const bk=sc()>=2000&&Math.random()<.4;if(bk&&!seenBlack){seenBlack=true;say(tr('m_black'));}
  cops.push({black:bk,lives:2,x:clamp(P.x+rnd(-120,120),roadX+30,roadX+roadW-30),y:H+90,w:32,h:58,ph:rnd(0,6)})}
function mkObs(x){const o=mkObs0(x);o.z=zoneAt(off+H+50);return o;}
function mkObs0(x){const k=Math.random();
  if(k<.4)return{type:'cone',x,y:-50,w:22,h:22};

function update(dt){
  t+=dt;clock+=dt;
  base=(330+Math.min(t*3,200))*L.sp;
  const tgt=base*(boost>0?1.55:1)*(stun>0?.35:1);

  {const zn=Math.floor(Math.max(0,zr(off+H-P.y))/ZL)+1;if(zn>curZone){curZone=zn;zb=0;zbz=(zn-1)%4;bonus+=100;beep(523,.12,'triangle',.08);setTimeout(()=>beep(659,.12,'triangle',.08),120);setTimeout(()=>beep(784,.22,'triangle',.08),240);}}
  {const ty=look().tr;if(ty!=='none'){trlT-=dt;while(trlT<=0){trlT+=.03;trl.push({x:P.x+rnd(-5,5),y:P.y+26-P.jz*.45,vx:rnd(-30,30),vy:rnd(10,60),l:.75,m:.75,r:rnd(0,6.28),s:rnd(.7,1.2),ty});}}
   for(const q of trl){q.x+=q.vx*dt;q.y+=(spd*.85+q.vy)*dt;q.l-=dt;q.r+=dt*4;}trl=trl.filter(q=>q.l>0);}
  let tx=0,ty=0;

  else{if(keys.ArrowLeft||keys.a)tx-=460;if(keys.ArrowRight||keys.d)tx+=460;if(keys.ArrowUp||keys.w)ty-=330;if(keys.ArrowDown||keys.s)ty+=330;}
  const st=stun>0?.5:1;
  const fk=ptr&&ptrId>=0&&moved?22:12;P.vx+=(tx*st-P.vx)*Math.min(1,dt*fk);P.vy+=(ty*st-P.vy)*Math.min(1,dt*fk);
  P.x+=P.vx*dt;P.y=clamp(P.y+P.vy*dt,H*0.45,H*0.88);

  {const lo=roadX+22,hi=roadX+roadW-22;if(P.x<lo||P.x>hi){const sd=P.x<lo?1:-1,v=Math.abs(P.vx);P.x=clamp(P.x,lo,hi);
    if(inv<=0&&v>40){wipeout('m_wall',P.x-sd*14,P.y);P.vx=sd*260;}else P.vx=0;}}
  P.tilt+=(P.vx/560*.5-P.tilt)*Math.min(1,dt*10);

  if((tCop-=dt)<=0&&cops.length<Math.min(L.c0+Math.floor(t/L.cg),L.cm)){spawnCop();tCop=Math.max(L.ci,L.ci*2-t*.03);}else if(tCop<=0)tCop=1;
  if((tObs-=dt)<=0){spawnObs();tObs=L.oi*Math.max(.5,1.3-t*.008)*rnd(.7,1.2)*(330/spd+.2);}
  if((tPz-=dt)<=0){const lanes=[.17,.5,.83],li=Math.floor(Math.random()*3),diag=Math.random()<.35?(li===2?-1:li===0?1:(Math.random()<.5?-1:1)):0;
    for(let i=0;i<5;i++)picks.push({k:'p',x:roadX+roadW*lanes[li]+diag*i*roadW*.075,y:-40-i*38,w:22,h:22});tPz=rnd(1.5,2.6);}
  if((tPick-=dt)<=0){picks.push({x:rnd(roadX+30,roadX+roadW-30),y:-40,w:26,h:26});if(Math.random()<.45)picks.push({x:rnd(roadX+30,roadX+roadW-30),y:-100,w:26,h:26,k:'h'});tPick=rnd(4,7);}

  for(const o of obs){o.y+=spd*dt;
    const low=P.jz>28;
    if(shield>0&&!low&&hit({x:P.x,y:P.y,w:P.w+14,h:P.h+10},o)){o.dead=1;smash(o.x,o.y,30,['#ffd24a','#ff7a30','#fff','#8a5a2a'],10);continue;}
    if(!low&&inv<=0&&hit({x:P.x,y:P.y,w:P.w,h:P.h},o)){wipeout('m_wipe',P.x,P.y);o.dead=1;}}

  for(const p of picks){p.y+=spd*dt;
    if(p.k==='p'){if(hit({x:P.x,y:P.y,w:P.w+16,h:P.h+6},p)){p.dead=1;runPz++;stats.coll++;pzBump=1;pzStreak=(t-pzLast<.7)?pzStreak+1:0;pzLast=t;beep(780+Math.min(pzStreak,8)*70,.07,'triangle',.06);
      for(let i=0;i<5;i++){const a2=rnd(0,6.28);parts.push({x:p.x,y:p.y,vx:Math.cos(a2)*90,vy:Math.sin(a2)*90,l:.35,m:.35,c:i%2?'#ffd24a':'#fff',r:2.2});}}continue;}
    if(hit({x:P.x,y:P.y,w:P.w+10,h:P.h},p)){p.dead=1;
      if(p.k==='h'){bonus+=25;stats.coll++;beep(880,.08,'triangle',.08);say(tr('heart'));}
      else{boost=3.5;beep(660,.12,'triangle',.1);setTimeout(()=>beep(990,.15,'triangle',.1),90);beers++;stats.beers++;stats.coll++;saveStats();
        if(beers>=5){beers=0;shield=10;say(tr('m_five'));beep(880,.3,'triangle',.12);}else say(tr('m_prost')+' '+beers+'/5');}}}

    if(inR(p,m.gear.x-6,m.gear.y-6,m.gear.w+12,m.gear.h+12)){showSet=true;return;}
    if(Math.hypot(p.x-m.arL.x,p.y-m.arL.y)<m.arL.r+10){nextCh(-1);return;}
    if(Math.hypot(p.x-m.arR.x,p.y-m.arR.y)<m.arR.r+10){nextCh(1);return;}
    const q=lvBtns(m);if(p.y>q.y-6&&p.y<q.y+q.h+6&&p.x>q.x0-4){const i=Math.floor((p.x-q.x0+q.gap/2)/(q.bwB+q.gap))+1;if(i>=1&&i<=5){lvl=i;savePrefs();beep(600,.06,'triangle',.06);return;}}
    if(inR(p,(W-m.go.w)/2-6,m.go.y-6,m.go.w+12,m.go.h+12)){launch();return;}
    if(p.y>m.stageTop&&p.y<m.ground+40){swX=p.x;}
    return;}
  if(state==='pause'){const q=pT(),px=(p.x-q.cx)/q.s+PW/2,py=(p.y-q.cy)/q.s+PH/2;if(px>=18&&px<=PW-18){if(py>=134&&py<=204){resumeGame();return;}if(py>=208&&py<=266){quitGame();return;}}return;}
  if(state==='resume')return;
  if(state==='play'){const hb=hudBtns();if(Math.hypot(p.x-hb.pz.x,p.y-hb.pz.y)<hb.pz.r+10){pauseGame();return;}if(Math.hypot(p.x-hb.mu.x,p.y-hb.mu.y)<hb.mu.r+8){muted=!muted;return;}}
  if(state==='over'){if(lbOverTap(p))return;overTap(p);return;}
  if(state==='play'){if(!(ptr&&performance.now()-tapT<40&&Math.hypot(p.x-tapX,p.y-tapY)<20)){ptr=p;ptrId=1;tapT=performance.now();tapX=p.x;tapY=p.y;tapJ=false;moved=false;}}
});
addEventListener('pointermove',e=>{if(nameUI)return;const p=pt(e);C3.setPointer(p.x,p.y);
  if(lbOpen&&state==='menu'){lbMove(p);return;}
  if(shopOpen&&state==='menu'){shopMove(p);return;}
  if(sliderDrag){setVol(p.x);return;}
  if(swX!==null&&Math.abs(p.x-swX)>50){nextCh(p.x<swX?1:-1);swX=null;return;}
  if(state==='play'&&e.pointerType!=='mouse')dbgPM++;if(ptr&&ptrId>=0&&(e.pointerType!=='mouse'||e.buttons)){ptr=p;if(Math.hypot(p.x-tapX,p.y-tapY)>12)moved=true;if(state==='play'&&!tapJ&&tapY-p.y>46&&performance.now()-tapT<350){tapJ=true;jump();}}});
const up=e=>{if(lbOpen)lbUp();if(shopOpen&&state==='menu'){shopUp(pt(e));}if(state==='over')overUp(pt(e));if(sliderDrag){sliderDrag=false;beep(660,.12,'triangle',.1);}swX=null;if(ptr&&ptrId>=0){if(state==='play'&&!tapJ&&!moved&&performance.now()-tapT<260)jump();ptr=null;ptrId=-1;}};
let dbgPM=0,dbgTM=0;
addEventListener('pointerup',up);addEventListener('pointercancel',up);
const tp=t=>{const r=cv.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}};
addEventListener('touchstart',e=>{if(state!=='play'||!e.touches.length)return;const p=tp(e.touches[0]);if(!(ptr&&performance.now()-tapT<40&&Math.hypot(p.x-tapX,p.y-tapY)<20)){ptr=p;ptrId=1;tapT=performance.now();tapX=p.x;tapY=p.y;tapJ=false;moved=false;}},{passive:true});
addEventListener('touchmove',e=>{if(state!=='play'||!e.touches.length)return;dbgTM++;if(!ptr)return;const p=tp(e.touches[0]);ptr=p;if(Math.hypot(p.x-tapX,p.y-tapY)>12)moved=true;if(!tapJ&&tapY-p.y>46&&performance.now()-tapT<350){tapJ=true;jump();}},{passive:true});
const tUp=e=>{if(state!=='play'||e.touches.length||!ptr)return;if(!tapJ&&!moved&&performance.now()-tapT<260)jump();ptr=null;ptrId=-1;};
addEventListener('touchend',tUp,{passive:true});addEventListener('touchcancel',tUp,{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});


// ---------- loop ----------
reset();
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='bust'){const pb=bt;bt+=dt;clock+=dt;if(pb<1.3&&bt>=1.3)beep(200,.15);if(pb<1.8&&bt>=1.8)beep(150,.3,'sawtooth',.1);if(bt>1.3&&bt<1.8)P.y+=140*dt;
    shake=Math.max(0,shake-dt*40);off+=40*dt;for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;}parts=parts.filter(p=>p.l>0);
    if(osc){try{gn.gain.value=0}catch(e){}}if(bt>3.4){state='over';lbSubmit();overAt=performance.now();clanged=false;ovS1=false;ovPress=null;}}
  else if(state==='launch'){lt+=dt;clock+=dt;off+=(75+clamp(lt/LDUR,0,1)*255)*dt;if(lt>=LDUR)start();}
  else if(state==='escape'){const pe=et;et+=dt;clock+=dt;off+=(40+clamp((et-1)/.8,0,1)*290)*dt;
    for(const tt of[.05,.15,.25,.34,.42])if(pe<tt&&et>=tt)beep(150+tt*420,.06,'square',.09);
    if(pe<.5&&et>=.5){beep(90,.4,'sawtooth',.15);beep(55,.5,'square',.11);beep(1400,.14,'triangle',.06);setTimeout(()=>beep(900,.18,'triangle',.06),90);shake=16;}
    if(pe<.95&&et>=.95){beep(330,.12,'triangle',.07);setTimeout(()=>beep(495,.12,'triangle',.07),90);setTimeout(()=>beep(660,.25,'triangle',.08),180);}
    if(pe<1.3&&et>=1.3)off0=off;
    shake=Math.max(0,shake-dt*40);if(et>=EDUR){fromJail=true;start();}}
  else if(state==='intro'){const pi=it;it+=dt;clock+=dt;off+=(330*L.sp+600*Math.sin(Math.min(it/3.4,1)*Math.PI))*dt;
    if(Math.floor(pi)!==Math.floor(it))beep(it<3?440:880,.15,'square',.08);if(it>3.4){state='play';P.x=W/2;P.tilt=0;}}
  else if(state==='play'){update(dt);oomp(dt);}
  else if(state==='pause'){if(osc){try{gn.gain.value=0}catch(e){}}}
  else if(state==='resume'){const pr=rt;rt+=dt;if(osc){try{gn.gain.value=0}catch(e){}}if(Math.floor(pr-.15)!==Math.floor(rt-.15)&&rt>.15&&rt<RDUR)beep(560,.12,'square',.07);if(rt>=RDUR){state='play';say(tr('go'));beep(880,.18,'square',.08);}}
  else{clock+=dt;off+=(state==='over'?40:state==='menu'?75:120)*dt;if(state==='menu'){shopUpdate(dt);lbUpdate(dt);refreshRank();}if(state==='over'&&!ovS1&&performance.now()-overAt>420){ovS1=true;beep(120,.2,'square',.1);beep(70,.25,'sawtooth',.08);}if(state==='over'&&!clanged&&performance.now()-overAt>1060){clanged=true;beep(180,.25,'square',.1);beep(110,.35,'sawtooth',.09);}shake=Math.max(0,shake-dt*40);if(osc){try{gn.gain.value=0}catch(e){}}}
  if(state==='menu'&&prevSt!=='menu'&&prevSt!=='')menuIn=0;if(prevSt===''&&state==='menu')menuIn=0;prevSt=state;if(state==='menu')menuIn+=dt;
  draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
