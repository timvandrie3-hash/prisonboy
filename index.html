  function latheX(prof,seg,dfn){const g=G.lathe(prof,seg),p=g.p;for(let i=0;i<p.length;i+=3){const x=p[i],y=p[i+1],z=p[i+2],r=Math.hypot(x,z);if(r<1e-4)continue;const ph=Math.atan2(x,z),k=(r+dfn(ph,y,r))/r;p[i]=x*k;p[i+2]=z*k;}g.n=calcNormals(p,g.i);return g;}
  function tubeX(pts0,rfn,ts,ns,ref,us,vs){us=us||1;vs=vs||1;const pts=[];const L=pts0.length-1;for(let k=0;k<=ns;k++){const f=k/ns*L,i=Math.min(L-1,Math.floor(f)),u=f-i;const a=pts0[Math.max(0,i-1)],b=pts0[i],c2=pts0[i+1],d=pts0[Math.min(L,i+2)],u2=u*u,u3=u2*u;
      pts.push([0,1,2].map(q=>.5*((2*b[q])+(-a[q]+c2[q])*u+(2*a[q]-5*b[q]+4*c2[q]-d[q])*u2+(-a[q]+3*b[q]-3*c2[q]+d[q])*u3)));}
    const P=[],U=[],I=[];let pn=null;for(let k=0;k<=ns;k++){const a=pts[Math.max(0,k-1)],b=pts[Math.min(ns,k+1)],T=G.nrm(G.sub(b,a));let Nn=pn?G.nrm(G.cross(G.cross(T,pn),T)):G.nrm(G.cross(T,G.cross(ref||[1,0,0],T)));pn=Nn;const Bn=G.cross(T,Nn);
      for(let j=0;j<=ts;j++){const an=TAU*j/ts,r=rfn(k/ns,an),c=Math.cos(an),sn=Math.sin(an);P.push(pts[k][0]+(Nn[0]*c+Bn[0]*sn)*r,pts[k][1]+(Nn[1]*c+Bn[1]*sn)*r,pts[k][2]+(Nn[2]*c+Bn[2]*sn)*r);U.push(j/ts*us,k/ns*vs);}}
    for(let k=0;k<ns;k++)for(let j=0;j<ts;j++){const a=k*(ts+1)+j,b=a+ts+1;I.push(a,b,a+1,b,b+1,a+1);}
    for(let k=0;k<=ns;k+=ns){const c=pts[k],ci=P.length/3;P.push(...c);U.push(.5,k/ns);for(let j=0;j<ts;j++){const a=k*(ts+1)+j;I.push(ci,a,a+1);}}

 ['Ein echter Labrador: Die Polizeihunde in der Brauerei wollen nicht jagen, sondern spielen – sie lassen ihn laufen und es gibt +25 Punkte. Außerdem springt er mit seinen kräftigen Hinterbeinen höher.',['Polizeihund','erwischt dich','+25 Pkt.'],'Polizeiautos, Fahrräder und Boote nehmen ihn trotzdem fest – Abstand halten!']],
en:[
 ['Prison Boy is a true Oktoberfest pro: the rampage starts after just 4 beers instead of 5. For 10 seconds you smash everything – police cars included.',['Beers to rampage','5','4'],'Go for the beers – you will rampage much more often.'],
 ['As a quick waitress she grabs everything on the way: pretzels, beers and gingerbread hearts close by fly straight to her.',['Pickup range','direct','+1 lane'],'No need to ride exactly over them – close is enough.'],
 ['Small and nimble: the kid slips past barrels, officers and benches more easily. And if he does crash, he is back up to speed twice as fast.',['Slowed after crash','0.9 s','0.45 s'],'Police cars still catch him – keep your distance!'],
 ['With fairy dust from Neverland he jumps higher and floats longer. Clearing police cars and whole rows of obstacles gets much easier.',['Time in the air','0.7 s','1.0 s'],'Longer jump: take off a little earlier! The pause between jumps stays the same.'],
 ['Nothing knocks him over: if a police car hits him, it bounces off his belly and crashes instead. Afterwards he is briefly invincible.',['Lives per run','1','2'],'Only once per run – the 🛡️ top left shows if your extra life is still there.'],
 ['One wink is enough: officers standing on the road just let him through – plus 10 points. Gingerbread hearts are worth twice as much for him.',['Gingerbread heart','+25','+50'],'Barrels and barriers can sadly not be charmed.'],
 ['Full steam ahead! The captain starts every run with a 3-second turbo and leaves the police behind. Walls are like quay walls to him: he bounces off instead of crashing.',['Wall crash','yes','no'],'Obstacles on the road still slow him down.'],
 ['With his sabre he knocks over officers standing on the road – each one is worth +40 points, and he is not slowed down.',['Officer on foot','crash','+40 pts'],'He cannot knock over police cars, barrels or barriers – only officers on foot.'],
 ['The legendary Wiesn mouse has exactly one superpower – but a strong one: every point counts double for the whole run.',['Points','×1','×2'],'Otherwise she rides like everyone else: no magnet, no extra lives.'],
 ['Who wants to arrest a baby? The police chase a bit more hesitantly – 15% slower than for everyone else. The scooter is way too big, but with arms stretched out it works!',['Police speed','100%','85%'],'Obstacles and barrels are still dangerous – stretch those little arms and dodge!'],
 ['With his e-fatbike and extra-wide tyres, water puddles do not slow the Gangster Kid down – he ploughs right through and scores points for it.',['Puddle','slower','+15 pts'],'Beer benches and officers are still dangerous – dodge them!'],
 ['A true Labrador: the police dogs in the brewery don\'t want to chase him – they want to play, so they let him go and you get +25 points. His strong back legs also make him jump higher.',['Police dog','catches you','+25 pts'],'Police cars, bikes and boats will still arrest him – keep your distance!']]};
